name: Build iOS IPA

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install xmake
      run: curl -fsSL https://xmake.io/shget.text | bash

    - name: Setup xmake
      run: echo "$HOME/.local/bin" >> $GITHUB_PATH

    - name: Configure for iOS
      run: xmake f -p iphoneos -a arm64 --yes

    - name: Install packages
      run: xmake require --yes

    - name: Build
      run: xmake -v

    - name: Package IPA
      run: |
        mkdir -p build/Payload/PeepoDrumKit.app
        cp build/iphoneos/arm64/release/PeepoDrumKit build/Payload/PeepoDrumKit.app/
        cp src/Info.plist build/Payload/PeepoDrumKit.app/
        if [ -d "assets" ]; then cp -r assets build/Payload/PeepoDrumKit.app/; fi
        if [ -d "locales" ]; then cp -r locales build/Payload/PeepoDrumKit.app/; fi
        cd build
        zip -r PeepoDrumKit.ipa Payload
        
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: PeepoDrumKit-iOS-Unsigned
        path: build/PeepoDrumKit.ipa
